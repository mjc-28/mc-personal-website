<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mya's Portfolio</title>
    <link rel="stylesheet" href="style.css" />

    <!--font family-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    />
    <!--to display an icon use <i class="b bx-ICON NAME></i>"-->
    <!-- bx=regular icons; bxs=solid icons; bxl=logos followed by icon name-->
  </head>
  <body>
    <header class="header">
      <a href="#home" class="logo">Mya <span>Coins</span></a>
      <i class="bx bx-menu" id="menuIcon"></i>

      <nav class="navBar">
        <a href="#home">Home</a>
        <!--#about: maybe take inspo from video with skills in a button style-->
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>

      <button class="gradientButton">Contact Me</button>
    </header>

    <main>
      <!--HOME SECTION-->
      <section class="home" id="home">
        <div class="homeInfo">
          <h1>Hello, I'm <span>Mya Coins</span></h1>

          <h3><span>Computer Science</span> Student</h3>

          <p>
            I am currently student majoring in Computer Science with a
            concentration in Human and Visual Computing.
          </p>

          <!--added in icons, but I think they should live in the  contact section-->

          <div class="buttons">
            <a href="#" class="btn">Hire</a>
            <a href="#contact" class="btn">Contact</a>
          </div>
        </div>

        <div class="homePic">
          <img src="profile photo.png" />
        </div>
      </section>
    </main>

    <scrip src="script.js"></scrip>
  </body>
</html>
